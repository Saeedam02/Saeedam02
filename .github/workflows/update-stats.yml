name: Update GitHub Profile Stats

on:
  schedule:
    # Run every day at 03:00 UTC
    - cron: "0 3 * * *"

  # Allow manual execution from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-github-profile-stats
  cancel-in-progress: true

jobs:
  generate-stats:
    name: Generate GitHub Profile Stats
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Create profile directory
        run: mkdir -p profile

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: "username=${{ github.repository_owner }}&theme=vue-dark&layout=compact&langs_count=6&card_width=340&hide_border=true&bg_color=273849&title_color=41B883&text_color=FFFFFF"
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit updated language card
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/top-langs.svg

          if git diff --cached --quiet; then
            echo "No changes detected."
          else
            git commit -m "Update GitHub language stats"
            git push
          fi
