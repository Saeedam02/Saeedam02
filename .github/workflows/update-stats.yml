name: Update GitHub Overview Card

on:
  schedule:
    # Update every day at 03:00 UTC
    - cron: "0 3 * * *"

  # Allow manual execution from GitHub Actions
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-github-overview-card
  cancel-in-progress: true

jobs:
  generate-overview:
    name: Generate GitHub Overview Card
    runs-on: ubuntu-latest

    steps:

      # ---------------------------------------------------------
      # 1. Checkout repository
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # ---------------------------------------------------------
      # 2. Create directories
      # ---------------------------------------------------------
      - name: Create directories
        run: |
          mkdir -p profile
          mkdir -p stats-source


      # ---------------------------------------------------------
      # 3. Generate Top Languages card
      #    Four languages only
      # ---------------------------------------------------------
      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: "username=${{ github.repository_owner }}&theme=vue-dark&layout=compact&langs_count=4&card_width=390&hide_border=true&bg_color=00000000&title_color=41B883&text_color=FFFFFF"
          path: stats-source/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true


      # ---------------------------------------------------------
      # 4. Get GitHub contribution data
      # ---------------------------------------------------------
      - name: Fetch GitHub contribution data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: |

          python3 <<'PY'

          import json
          import os
          import urllib.request
          from datetime import date, timedelta
          from pathlib import Path


          TOKEN = os.environ["GITHUB_TOKEN"]
          USERNAME = os.environ["GITHUB_USERNAME"]

          API_URL = "https://api.github.com/graphql"


          # -----------------------------------------------------
          # GraphQL query
          # -----------------------------------------------------

          QUERY = """
          query($login: String!, $from: DateTime!, $to: DateTime!) {
            user(login: $login) {
              contributionsCollection(from: $from, to: $to) {
                contributionCalendar {
                  totalContributions
                  weeks {
                    contributionDays {
                      date
                      contributionCount
                    }
                  }
                }
              }
            }
          }
          """


          def github_graphql(from_date, to_date):

              variables = {
                  "login": USERNAME,
                  "from": f"{from_date}T00:00:00Z",
                  "to": f"{to_date}T23:59:59Z"
              }

              payload = json.dumps({
                  "query": QUERY,
                  "variables": variables
              }).encode("utf-8")

              request = urllib.request.Request(
                  API_URL,
                  data=payload,
                  headers={
                      "Authorization": f"bearer {TOKEN}",
                      "Content-Type": "application/json",
                      "User-Agent": "GitHub-Profile-Stats"
                  },
                  method="POST"
              )

              with urllib.request.urlopen(request) as response:
                  result = json.loads(response.read().decode("utf-8"))

              if "errors" in result:
                  raise RuntimeError(
                      "GitHub GraphQL API error:\n"
                      + json.dumps(result["errors"], indent=2)
                  )

              return result["data"]["user"]["contributionsCollection"]


          # -----------------------------------------------------
          # Determine years to retrieve
          #
          # Your account started in 2022, so we retrieve
          # contribution data from 2022 through the current year.
          # -----------------------------------------------------

          today = date.today()

          first_year = 2022
          last_year = today.year

          all_days = []


          # -----------------------------------------------------
          # Retrieve every year separately.
          #
          # This avoids depending on the limitation of a single
          # contribution-calendar request.
          # -----------------------------------------------------

          for year in range(first_year, last_year + 1):

              start = date(year, 1, 1)

              if year == today.year:
                  end = today
              else:
                  end = date(year, 12, 31)

              print(
                  f"Fetching contributions for "
                  f"{start} -> {end}"
              )

              collection = github_graphql(start, end)

              calendar = collection["contributionCalendar"]

              for week in calendar["weeks"]:
                  for day_data in week["contributionDays"]:

                      all_days.append({
                          "date": day_data["date"],
                          "count": day_data["contributionCount"]
                      })


          # -----------------------------------------------------
          # Remove duplicate dates and sort chronologically
          # -----------------------------------------------------

          unique_days = {}

          for item in all_days:
              unique_days[item["date"]] = item["count"]


          all_days = [
              {
                  "date": key,
                  "count": value
              }
              for key, value in unique_days.items()
          ]

          all_days.sort(key=lambda x: x["date"])


          # -----------------------------------------------------
          # TOTAL CONTRIBUTIONS
          # -----------------------------------------------------

          total_contributions = sum(
              item["count"]
              for item in all_days
          )


          # -----------------------------------------------------
          # LONGEST STREAK
          #
          # A streak means consecutive calendar days where
          # contributionCount > 0.
          # -----------------------------------------------------

          longest_streak = 0
          longest_start = None
          longest_end = None

          current_length = 0
          current_start = None
          previous_date = None


          for item in all_days:

              current_date = date.fromisoformat(item["date"])

              if (
                  item["count"] > 0
                  and
                  previous_date is not None
                  and
                  current_date == previous_date + timedelta(days=1)
              ):

                  current_length += 1

              elif item["count"] > 0:

                  current_length = 1
                  current_start = current_date

              else:

                  current_length = 0
                  current_start = None


              if current_length > longest_streak:

                  longest_streak = current_length
                  longest_start = current_start
                  longest_end = current_date


              previous_date = current_date


          # -----------------------------------------------------
          # CURRENT STREAK
          #
          # If today has contributions, the streak ends today.
          #
          # If today has no contributions, we check yesterday.
          # This matches the usual streak-card behavior.
          # -----------------------------------------------------

          day_lookup = {
              date.fromisoformat(item["date"]): item["count"]
              for item in all_days
          }


          if day_lookup.get(today, 0) > 0:

              streak_end = today

          else:

              streak_end = today - timedelta(days=1)


          current_streak = 0
          current_streak_start = None


          if day_lookup.get(streak_end, 0) > 0:

              current_date = streak_end

              while day_lookup.get(current_date, 0) > 0:

                  current_streak += 1
                  current_streak_start = current_date

                  current_date -= timedelta(days=1)


          # -----------------------------------------------------
          # Format dates
          # -----------------------------------------------------

          def format_date(value):

              if value is None:
                  return ""

              return value.strftime("%b %d, %Y")


          current_start_text = format_date(
              current_streak_start
          )

          current_end_text = format_date(
              streak_end
              if current_streak > 0
              else None
          )

          longest_start_text = format_date(
              longest_start
          )

          longest_end_text = format_date(
              longest_end
          )


          # -----------------------------------------------------
          # Save data for the SVG generator
          # -----------------------------------------------------

          stats = {

              "username": USERNAME,

              "total_contributions":
                  total_contributions,

              "current_streak":
                  current_streak,

              "current_streak_start":
                  current_start_text,

              "current_streak_end":
                  current_end_text,

              "longest_streak":
                  longest_streak,

              "longest_streak_start":
                  longest_start_text,

              "longest_streak_end":
                  longest_end_text
          }


          Path("stats-source/contributions.json").write_text(
              json.dumps(stats, indent=2),
              encoding="utf-8"
          )


          print()
          print("====================================")
          print("GitHub Contribution Statistics")
          print("====================================")
          print(
              "Total Contributions:",
              total_contributions
          )
          print(
              "Current Streak:",
              current_streak
          )
          print(
              "Longest Streak:",
              longest_streak
          )
          print(
              "Current Streak:",
              current_start_text,
              "-",
              current_end_text
          )
          print(
              "Longest Streak:",
              longest_start_text,
              "-",
              longest_end_text
          )
          print("====================================")

          PY


      # ---------------------------------------------------------
      # 5. Build ONE combined SVG card
      # ---------------------------------------------------------
      - name: Build combined GitHub overview card
        run: |

          python3 <<'PY'

          import json
          import html
          import re

          from copy import deepcopy
          from pathlib import Path

          import xml.etree.ElementTree as ET


          SVG_NS = "http://www.w3.org/2000/svg"

          ET.register_namespace("", SVG_NS)


          def svg_tag(name):
              return f"{{{SVG_NS}}}{name}"


          # -----------------------------------------------------
          # Read contribution statistics
          # -----------------------------------------------------

          with open(
              "stats-source/contributions.json",
              "r",
              encoding="utf-8"
          ) as file:

              stats = json.load(file)


          # -----------------------------------------------------
          # Read Top Languages SVG
          # -----------------------------------------------------

          languages_tree = ET.parse(
              "stats-source/top-langs.svg"
          )

          languages_root = languages_tree.getroot()


          languages_viewbox = languages_root.get(
              "viewBox",
              "0 0 390 190"
          )


          # -----------------------------------------------------
          # Prevent duplicate SVG IDs
          # -----------------------------------------------------

          def prefix_ids(root, prefix):

              id_map = {}

              for element in root.iter():

                  old_id = element.get("id")

                  if old_id:

                      new_id = f"{prefix}-{old_id}"

                      id_map[old_id] = new_id

                      element.set(
                          "id",
                          new_id
                      )


              for element in root.iter():

                  for attribute, value in list(
                      element.attrib.items()
                  ):

                      for old_id, new_id in id_map.items():

                          value = value.replace(
                              f"url(#{old_id})",
                              f"url(#{new_id})"
                          )

                          if value == f"#{old_id}":

                              value = f"#{new_id}"

                      element.set(
                          attribute,
                          value
                      )


                  if (
                      element.tag == svg_tag("style")
                      and element.text
                  ):

                      for old_id, new_id in id_map.items():

                          element.text = element.text.replace(
                              f"#{old_id}",
                              f"#{new_id}"
                          )


          prefix_ids(
              languages_root,
              "languages"
          )


          # -----------------------------------------------------
          # Card dimensions
          # -----------------------------------------------------

          CARD_WIDTH = 920
          CARD_HEIGHT = 210

          LEFT_WIDTH = 390
          RIGHT_X = 410


          # -----------------------------------------------------
          # Create main SVG
          # -----------------------------------------------------

          root = ET.Element(
              svg_tag("svg"),
              {
                  "width": str(CARD_WIDTH),
                  "height": str(CARD_HEIGHT),
                  "viewBox":
                      f"0 0 {CARD_WIDTH} {CARD_HEIGHT}",
                  "role": "img"
              }
          )


          # -----------------------------------------------------
          # Accessible title
          # -----------------------------------------------------

          title = ET.SubElement(
              root,
              svg_tag("title")
          )

          title.text = (
              "Saeed's GitHub overview"
          )


          # -----------------------------------------------------
          # Main background
          # -----------------------------------------------------

          ET.SubElement(
              root,
              svg_tag("rect"),
              {
                  "x": "0",
                  "y": "0",
                  "width": str(CARD_WIDTH),
                  "height": str(CARD_HEIGHT),
                  "rx": "8",
                  "fill": "#273849"
              }
          )


          # -----------------------------------------------------
          # Vertical separator
          # -----------------------------------------------------

          ET.SubElement(
              root,
              svg_tag("line"),
              {
                  "x1": str(RIGHT_X),
                  "y1": "18",
                  "x2": str(RIGHT_X),
                  "y2": "192",
                  "stroke": "#FFFFFF",
                  "stroke-opacity": "0.22",
                  "stroke-width": "1"
              }
          )


          # -----------------------------------------------------
          # Insert Top Languages card
          # -----------------------------------------------------

          nested_languages = ET.SubElement(
              root,
              svg_tag("svg"),
              {
                  "x": "0",
                  "y": "10",
                  "width": str(LEFT_WIDTH),
                  "height": "190",
                  "viewBox": languages_viewbox,
                  "preserveAspectRatio":
                      "xMidYMid meet"
              }
          )


          for child in languages_root:

              nested_languages.append(
                  deepcopy(child)
              )


          # -----------------------------------------------------
          # Colors
          # -----------------------------------------------------

          GREEN = "#41B883"
          WHITE = "#FFFFFF"
          MUTED = "#B8C7D1"


          # -----------------------------------------------------
          # RIGHT SIDE
          # -----------------------------------------------------

          # Center positions for the three statistics

          col1 = 500
          col2 = 665
          col3 = 830


          # -----------------------------------------------------
          # Total Contributions
          # -----------------------------------------------------

          total_text = ET.SubElement(
              root,
              svg_tag("text"),
              {
                  "x": str(col1),
                  "y": "78",
                  "text-anchor": "middle",
                  "font-family":
                      "Arial, Helvetica, sans-serif",
                  "font-size": "34",
                  "font-weight": "700",
                  "fill": GREEN
              }
          )

          total_text.text = str(
              stats["total_contributions"]
          )


          total_label = ET.SubElement(
              root,
              svg_tag("text"),
              {
                  "x": str(col1),
                  "y": "108",
                  "text-anchor": "middle",
                  "font-family":
                      "Arial, Helvetica, sans-serif",
                  "font-size": "14",
                  "fill": GREEN
              }
          )

          total_label.text = "Total Contributions"


          # -----------------------------------------------------
          # Current Streak
          # -----------------------------------------------------

          current = stats["current_streak"]


          # Ring

          ET.SubElement(
              root,
              svg_tag("circle"),
              {
                  "cx": str(col2),
                  "cy": "62",
                  "r": "38",
                  "fill": "none",
                  "stroke": GREEN,
                  "stroke-width": "6"
              }
          )


          current_text = ET.SubElement(
              root,
              svg_tag("text"),
              {
                  "x": str(col2),
                  "y": "73",
                  "text-anchor": "middle",
                  "font-family":
                      "Arial, Helvetica, sans-serif",
                  "font-size": "30",
                  "font-weight": "700",
                  "fill": GREEN
              }
          )

          current_text.text = str(current)


          current_label = ET.SubElement(
              root,
              svg_tag("text"),
              {
                  "x": str(col2),
                  "y": "125",
                  "text-anchor": "middle",
                  "font-family":
                      "Arial, Helvetica, sans-serif",
                  "font-size": "14",
                  "font-weight": "700",
                  "fill": GREEN
              }
          )

          current_label.text = "Current Streak"


          # Current streak dates

          current_dates = ET.SubElement(
              root,
              svg_tag("text"),
              {
                  "x": str(col2),
                  "y": "150",
                  "text-anchor": "middle",
                  "font-family":
                      "Arial, Helvetica, sans-serif",
                  "font-size": "11",
                  "fill": WHITE
              }
          )

          if current > 0:

              current_dates.text = (
                  f"{stats['current_streak_start']} - "
                  f"{stats['current_streak_end']}"
              )

          else:

              current_dates.text = "No active streak"


          # -----------------------------------------------------
          # Longest Streak
          # -----------------------------------------------------

          longest_text = ET.SubElement(
              root,
              svg_tag("text"),
              {
                  "x": str(col3),
                  "y": "78",
                  "text-anchor": "middle",
                  "font-family":
                      "Arial, Helvetica, sans-serif",
                  "font-size": "34",
                  "font-weight": "700",
                  "fill": GREEN
              }
          )

          longest_text.text = str(
              stats["longest_streak"]
          )


          longest_label = ET.SubElement(
              root,
              svg_tag("text"),
              {
                  "x": str(col3),
                  "y": "108",
                  "text-anchor": "middle",
                  "font-family":
                      "Arial, Helvetica, sans-serif",
                  "font-size": "14",
                  "fill": GREEN
              }
          )

          longest_label.text = "Longest Streak"


          # Longest streak dates

          longest_dates = ET.SubElement(
              root,
              svg_tag("text"),
              {
                  "x": str(col3),
                  "y": "140",
                  "text-anchor": "middle",
                  "font-family":
                      "Arial, Helvetica, sans-serif",
                  "font-size": "10",
                  "fill": WHITE
              }
          )

          longest_dates.text = (
              f"{stats['longest_streak_start']} - "
              f"{stats['longest_streak_end']}"
          )


          # -----------------------------------------------------
          # Write final SVG
          # -----------------------------------------------------

          output = Path(
              "profile/github-overview.svg"
          )

          output.parent.mkdir(
              parents=True,
              exist_ok=True
          )


          ET.ElementTree(root).write(
              output,
              encoding="utf-8",
              xml_declaration=True
          )


          print(
              f"Generated: {output}"
          )

          PY


      # ---------------------------------------------------------
      # 6. Commit generated card
      # ---------------------------------------------------------
      - name: Commit updated overview card
        shell: bash
        run: |

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/github-overview.svg

          if git diff --cached --quiet; then

            echo "No changes detected."

          else

            git commit \
              -m "Update GitHub overview card"

            git push

          fi
